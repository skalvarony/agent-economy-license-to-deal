<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>At the venue</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230d0d0d'/%3E%3Cpath d='M8 22V12l8-5 8 5v10z' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preload" href="/static/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/venue.css">
<script src="/static/venue.js" defer></script>
</head>
<body>
<aside class="side">
  <p class="brand" data-name>At the venue</p>
  <h2>Venue</h2>
  <div class="shops" id="venues" role="tablist" aria-label="Venue"></div>
  <form class="who" method="post" action="/logout" id="who" hidden>
    <span>Signed in as <b data-user></b></span>
    <button type="submit" class="quiet">Sign out</button>
  </form>
</aside>

<main>
  <header class="bar">
    <h1><span data-venue-name>All venues</span> <span class="muted">Arrivals</span></h1>
    <span class="status" id="status" role="status"></span>
  </header>

  <section class="section" data-section="arrivals">
    <div class="kpis" id="kpis"></div>
    <div class="tools">
      <input type="search" id="search" placeholder="Filter by customer, deal, code or order id">
      <span class="count" id="count"></span>
      <button type="button" class="quiet" data-refresh>Refresh</button>
    </div>
    <div class="chips" id="chips">
      <div class="chip-group" data-filter="state">
        <button type="button" class="chip on" data-value="open">Open</button>
        <button type="button" class="chip" data-value="all">Everything</button>
        <button type="button" class="chip" data-value="used">Used</button>
        <button type="button" class="chip" data-value="letdown">Let down</button>
        <button type="button" class="chip" data-value="refunded">Refunded</button>
      </div>
      <div class="chip-group" data-filter="shop" id="shop-chips"></div>
      <div class="chip-group" data-filter="door">
        <button type="button" class="chip on" data-value="all">Any door</button>
        <button type="button" class="chip" data-value="agent">Agent</button>
        <button type="button" class="chip" data-value="web">Web</button>
      </div>
    </div>
    <div class="split">
      <div class="table-wrap">
        <table id="arrivals">
          <thead><tr><th class="flag" aria-label="State"></th><th>Bought</th><th>Via</th><th>Customer</th><th>Deal</th><th>Code</th><th>State</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <aside class="detail" id="detail" hidden></aside>
    </div>
  </section>
</main>
</body>
</html>
