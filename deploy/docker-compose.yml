# The three shops, the agents, their console and Caddy (HTTPS) on one machine.
#
#   cp .env.example .env     # then fill it in
#   docker compose up -d --build
#
# The shops share one volume, so their ledger stays one file. Caddy gets
# and renews the certificates for <DOMAIN>, a., b., c., admin. and the three
# agents' own names.

x-shop: &shop
  build:
    context: ../rest/python/server
  restart: unless-stopped
  environment: &shop-env
    SIMULATION_SECRET: ${SIMULATION_SECRET:?set SIMULATION_SECRET in .env}
    DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    REQUIRE_SIGNATURES: ${REQUIRE_SIGNATURES:-1}
    REQUIRE_SIGNATURE_NONCE: ${REQUIRE_SIGNATURE_NONCE:-1}
    ALLOW_INSECURE_PROFILES: ${ALLOW_INSECURE_PROFILES:-0}
    SECURE_COOKIES: ${SECURE_COOKIES:-1}
    RESEED: ${RESEED:-0}
    PAYMENT_RAIL: ${PAYMENT_RAIL:-mock}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  volumes:
    - shops:/data
    - ../shops:/shops:ro

services:
  shop-a:
    <<: *shop
    environment:
      <<: *shop-env
      SHOP: a
  shop-b:
    <<: *shop
    environment:
      <<: *shop-env
      SHOP: b
  shop-c:
    <<: *shop
    environment:
      <<: *shop-env
      SHOP: c

  # One agent per person: its own key, its own record, its own public name,
  # on a domain the shops don't control.
  agent-alvaro:
    build:
      context: ..
      dockerfile: agent/Dockerfile
    restart: unless-stopped
    environment:
      AGENT_URL: https://${AGENT_ALVARO_HOST:?set AGENT_ALVARO_HOST in .env}
      AGENT_NAME: "Álvaro's agent"
      AGENT_CUSTOMER_NAME: "Álvaro Fernández"
      AGENT_CUSTOMER_EMAIL: afernandezde@licensetodeal.app
      SHOP_A_URL: https://a.${DOMAIN}
      SHOP_B_URL: https://b.${DOMAIN}
      SHOP_C_URL: https://c.${DOMAIN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-gpt-5-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AGENT_BRAIN: ${AGENT_BRAIN:-}
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-1500}
      AGENT_FALLBACK_MODEL: ${AGENT_FALLBACK_MODEL:-}
      AGENT_CARD_HANDLER: ${AGENT_CARD_HANDLER:-mock_payment_handler}
      AGENT_CARD_TOKEN: ${AGENT_CARD_TOKEN:-success_token}
      # Who may sign in: the person's own login, else the team's.
      LOGIN_USERS: ${LOGIN_USERS_ALVARO:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN_ALVARO:-}
      AGENT_PHONE: ${AGENT_PHONE_ALVARO:-}
      AGENT_USER: ${AGENT_USER:-}
      AGENT_PASSWORD_HASH: ${AGENT_PASSWORD_HASH:-}
      SIMULATION_SECRET: ${SIMULATION_SECRET}
    volumes:
      - agent-alvaro:/data

  console:
    build:
      context: ..
      dockerfile: console/Dockerfile
    restart: unless-stopped
    environment:
      SIMULATION_SECRET: ${SIMULATION_SECRET}
      SHOP_A_URL: http://shop-a:8080
      SHOP_B_URL: http://shop-b:8080
      SHOP_C_URL: http://shop-c:8080
      AGENT_URLS: https://${AGENT_ALVARO_HOST}/profile.json=http://agent-alvaro:8190
      CONSOLE_RUN_DIR: /data
      AGENT_USER: ${AGENT_USER:-}
      AGENT_PASSWORD_HASH: ${AGENT_PASSWORD_HASH:-}
    volumes:
      - console:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ALT_DOMAIN: ${ALT_DOMAIN:-${DOMAIN}}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      AGENT_ALVARO_HOST: ${AGENT_ALVARO_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./landing:/srv/landing:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  shops:
  agent-alvaro:
  console:
  caddy_data:
  caddy_config:
